aid: carnot-fleet
name: Carnot Fleet
description: Carnot Fleet (Carnotfleet) is a Seoul-based cold-chain technology company that converts
  non-refrigerated vehicles into temperature-controlled units in under 30 minutes using modular
  insulation panels and proprietary solid-state thermoelectric heat pumps, spanning frozen, chilled,
  and ambient ranges with humidity control. Its Adaptive Thermal Control System (ATCS) is an AI-based
  autonomous control platform delivering cloud-connected temperature monitoring at 10-second intervals.
  Carnot Fleet surfaces its capabilities through the CF Mobile Application, the CF Portal, and CF APIs
  that let customers integrate the ATCS into existing logistics solutions to detect, analyze, prevent,
  and discover cold-chain data points and reduce post-harvest to pre-retail loss across the supply chain.
